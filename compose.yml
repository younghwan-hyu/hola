services:
  server:
    build: ./server
    env_file: ./server/.env
    environment:
      PORT: 3000
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/google_service_account.json
    volumes:
      - ./server/google_service_account.json:/secrets/google_service_account.json:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
