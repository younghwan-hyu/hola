server {
    listen 80;
    # HTTPS with a build-time self-signed cert (see web/Dockerfile). getUserMedia
    # (camera/mic) only works in a secure context — HTTPS or localhost — so a
    # phone hitting this over the LAN needs https. Browsers will warn about the
    # self-signed cert; proceed once and the origin becomes a secure context.
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/self.crt;
    ssl_certificate_key /etc/nginx/certs/self.key;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE: never buffer; let chunks flush immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
